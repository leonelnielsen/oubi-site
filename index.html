<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUBI - Operational Unified Base & Intelligence - Em Construção</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* Fundo escuro elegante */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .logo {
            max-width: 250px; /* Ajusta o tamanho da logo na tela */
            height: auto;
            margin-bottom: 30px;
            animation: float 4s ease-in-out infinite; /* Efeito flutuante suave */
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #aaaaaa;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Certifique-se de que o nome da imagem abaixo está idêntico ao arquivo enviado -->
        <img src="OUBI.svg" alt="logo_OUBI" class="logo">
        <h1>Em Construção</h1>
        <p>Estamos preparando algo incrível para você. Volte em breve!</p>
    </div>

</body>
</html>
