<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OUBI - Operational Unified Base & Intelligence - Em Construção</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 20px;
        }

        .logo {
            max-width: 250px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
            animation: float 4s ease-in-out infinite;
        }

        .brand {
            margin: 0 0 10px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffffff;
        }

        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin: 10px 0;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="OUBI.svg" alt="OUBI" class="logo">
        <p class="brand">OUBI - Operational Unified Base & Intelligence</p>
        <h1>Em Construção</h1>
        <p>Estamos preparando algo incrível para você. Volte em breve!</p>
    </div>

</body>
</html>
